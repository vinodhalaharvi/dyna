name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, without the v (e.g. 0.1.0)"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./... && go test ./...
      - env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.version }}
        run: gh release create "v$V" --target "$(git rev-parse HEAD)" --title "dyna $V" --generate-notes
